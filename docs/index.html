<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体調ガード サポート</title>
<style>
  :root { --bg: #f7f6f9; --fg: #26222e; --muted: #6c6577; --accent: #7a4f9a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17141c; --fg: #ece8f1; --muted: #a59db0; --accent: #c9a3e8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.8 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; color: var(--accent); margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 32px 0 8px; }
  p, li { margin: 0 0 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>体調ガード</h1>
  <p>生理やPMSの時期に重い予定が重なりそうなとき、前もって知らせるカレンダーアプリです。データはすべて端末の中だけで扱います。</p>

  <h2>よくある質問</h2>
  <p><strong>予定が表示されません。</strong><br>端末の設定アプリで、体調ガードのカレンダーへのアクセスを許可してください。</p>
  <p><strong>通知が届きません。</strong><br>アプリの設定で「重なる予定の前に通知する」がオンか、端末の設定で通知が許可されているかを確認してください。通知は朝9時に届きます。</p>
  <p><strong>機種変更するときは？</strong><br>アプリの設定から「データを書き出す」で記録を保存してください。</p>

  <h2>お問い合わせ</h2>
  <p><a href="https://github.com/michan1207/karenda/issues">GitHubのIssues</a>からどうぞ。</p>
  <p><a href="./privacy.html">プライバシーポリシー</a></p>
</main>
</body>
</html>
